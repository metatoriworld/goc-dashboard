<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10"><title>GOC | DRIVE GALLERY</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--muted:#8c95a4;--line:#282c36;--gold:#d7b98b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#f5f4f1;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button{font:inherit;cursor:pointer}header{max-width:1320px;margin:auto;padding:28px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-size:27px;font-weight:850;letter-spacing:.2em}.brand span{color:var(--gold)}header small{color:#9aa3b2;letter-spacing:.2em}.hero{max-width:1320px;margin:auto;padding:76px 24px 38px}.eyebrow{color:var(--gold);letter-spacing:.3em;font-size:12px;font-weight:700}.hero h1{font-size:clamp(46px,8vw,104px);line-height:.98;letter-spacing:-.065em;margin:18px 0}.hero h1 em{font-style:normal;color:var(--gold)}.hero p{color:var(--muted);font-size:15px;line-height:1.8}.toolbar{max-width:1320px;margin:auto;padding:20px 24px 26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{padding:10px 17px;background:#151820;border:1px solid #2c3038;color:#ccd0d6;border-radius:100px}.filter.active,.filter:hover{background:var(--gold);color:#16120d;border-color:var(--gold)}.count{font-size:12px;color:var(--muted);letter-spacing:.1em}.gallery{max-width:1320px;margin:auto;padding:0 24px 100px;display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.tile{grid-column:span 4;position:relative;min-width:0;overflow:hidden;background:#141820;border:1px solid #242831;border-radius:15px;aspect-ratio:4/5;cursor:pointer;text-align:left;padding:0;color:inherit}.tile:nth-child(1),.tile:nth-child(5){grid-column:span 6;aspect-ratio:1.38}.tile:nth-child(2){grid-column:span 6;aspect-ratio:1.38}.tile img{width:100%;height:100%;object-fit:cover;transition:transform .55s ease;display:block}.tile:hover img{transform:scale(1.055)}.tile:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.84))}.label{position:absolute;z-index:1;bottom:23px;left:25px;right:25px;display:flex;justify-content:space-between;align-items:end}.label strong{display:block;font-size:21px;margin-top:5px}.label small{font-size:11px;color:#e1c69f;letter-spacing:.18em}.arrow{font-size:21px}.lightbox{position:fixed;z-index:10;inset:0;background:rgba(3,4,7,.96);display:none;align-items:center;justify-content:center;flex-direction:column;padding:64px 20px 34px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:calc(100vh - 160px);object-fit:contain;border-radius:8px}.lightbox .caption{margin-top:18px;color:#ddd;text-align:center}.lightbox button{position:absolute;border:1px solid #555;background:#171a20;color:white;border-radius:50%;width:43px;height:43px;font-size:22px}.close{right:18px;top:18px}.prev{left:15px;top:50%}.next{right:15px;top:50%}footer{border-top:1px solid var(--line);padding:34px 24px;text-align:center;color:#858c97;font-size:12px;letter-spacing:.12em}@media(max-width:760px){header{padding:20px}.hero{padding:55px 20px 25px}.toolbar{padding:20px}.gallery{padding:0 14px 70px;gap:12px}.tile,.tile:nth-child(1),.tile:nth-child(2),.tile:nth-child(5){grid-column:span 12;aspect-ratio:1.15}.label strong{font-size:19px}}@media(prefers-reduced-motion:reduce){.tile img{transition:none}}
</style></head><body>
<header><div class="brand">G<span>O</span>C</div><small>GUARDIANS OF CONTINUITY</small></header>
<section class="hero"><div class="eyebrow">THE ROAD. THE MOMENT. THE MEMORY.</div><h1>DRIVE<br><em>GALLERY.</em></h1><p>함께 잇는 가치.<br>도로 위의 순간을 한 장의 작품으로 기록합니다.</p></section>
<div class="toolbar"><div class="filters" id="filters"><button class="filter active" data-tag="all">전체</button><button class="filter" data-tag="sunset">선셋</button><button class="filter" data-tag="night">나이트</button><button class="filter" data-tag="art">아트</button><button class="filter" data-tag="city">시티</button></div><span class="count" id="count">05 PHOTOS</span></div>
<main class="gallery" id="gallery" aria-label="GOC 자동차 사진 갤러리"></main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 확대 보기"><button class="close" id="close" aria-label="닫기">×</button><button class="prev" id="prev" aria-label="이전 사진">‹</button><img id="large" alt=""><div class="caption" id="caption"></div><button class="next" id="next" aria-label="다음 사진">›</button></div>
<footer>GOC · GENESIS OWNERS CLUB · 함께 잇는 가치</footer>
<script>
const photos=[
{file:"images/sunset-coast.jpg",name:"Golden Coast",sub:"SUNSET DRIVE",tag:"sunset"},
{file:"images/aurora-night.jpg",name:"Aurora Night",sub:"NIGHT DRIVE",tag:"night"},
{file:"images/cute-sunset.jpg",name:"Sweet Sunset",sub:"CREATIVE ART",tag:"art"},
{file:"images/fire-motion.jpg",name:"Fire Motion",sub:"CREATIVE ART",tag:"art"},
{file:"images/neon-city.jpg",name:"Neon Rush",sub:"CITY DRIVE",tag:"city"}];
let visible=photos.slice(),current=0,lastFocus=null;const gallery=document.getElementById("gallery"),lb=document.getElementById("lightbox");
function render(tag="all"){visible=photos.filter(p=>tag==="all"||p.tag===tag);gallery.replaceChildren();visible.forEach((p,i)=>{const b=document.createElement("button");b.className="tile";b.setAttribute("aria-label",p.name+" 사진 확대");const img=document.createElement("img");img.src=p.file;img.alt="GOC 자동차 사진: "+p.name;img.loading=i>1?"lazy":"eager";const label=document.createElement("div");label.className="label";label.innerHTML="<div><small>"+p.sub+"</small><strong>"+p.name+"</strong></div><span class='arrow'>↗</span>";b.append(img,label);b.addEventListener("click",()=>open(i,b));gallery.append(b)});document.getElementById("count").textContent=String(visible.length).padStart(2,"0")+" PHOTOS"}
document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.tag)}));
function open(i,btn){lastFocus=btn;current=i;show();lb.classList.add("open");document.body.style.overflow="hidden";document.getElementById("close").focus()}
function show(){const p=visible[current];document.getElementById("large").src=p.file;document.getElementById("large").alt=p.name;document.getElementById("caption").textContent=p.name+" · "+p.sub}
function close(){lb.classList.remove("open");document.body.style.overflow="";lastFocus?.focus()}
function move(n){current=(current+n+visible.length)%visible.length;show()}
document.getElementById("close").onclick=close;document.getElementById("prev").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1);lb.addEventListener("click",e=>{if(e.target===lb)close()});document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});render();
</script></body></html>
