<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOC DRIVE GALLERY</title><style>*{box-sizing:border-box}body{margin:0;background:#090b12;color:#fff;font:15px system-ui,'Noto Sans KR',sans-serif}header{padding:22px 5%;border-bottom:1px solid #242735;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900;letter-spacing:4px}.logo b{color:#f7a968}.meta{color:#9ba1b0;font-size:11px;letter-spacing:1px}.hero{padding:70px 15px;text-align:center;background:radial-gradient(ellipse at top,#292138,transparent 65%)}.hero small{color:#f7b77c;letter-spacing:5px}.hero h1{font-size:clamp(36px,7vw,75px);letter-spacing:-2px;margin:12px 0}.hero p{color:#aeb3c0}.wrap{max-width:1200px;margin:auto;padding:0 18px 70px}.count{color:#aab0be;margin-bottom:20px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.tile{overflow:hidden;background:#151923;border:1px solid #303443;border-radius:18px;cursor:pointer}.tile:first-child{grid-row:span 2}.tile img{display:block;width:100%;height:340px;object-fit:cover}.tile:first-child img{height:730px}.label{padding:18px}.label small{color:#f4af76;letter-spacing:2px}.label h2{font-size:19px;margin:7px 0}.label p{font-size:13px;color:#a2a9b6;margin:0}.viewer{display:none;position:fixed;inset:0;background:#000e;z-index:4;align-items:center;justify-content:center;padding:50px 15px}.viewer.on{display:flex}.viewer img{max-width:100%;max-height:88vh;object-fit:contain}.viewer button{position:absolute;top:10px;right:20px;background:none;border:0;color:white;font-size:42px}footer{text-align:center;border-top:1px solid #252838;padding:25px;color:#838a99}@media(max-width:700px){.hero{padding:45px 15px}.grid{grid-template-columns:1fr}.tile:first-child{grid-row:auto}.tile img,.tile:first-child img{height:auto;max-height:75vh;object-fit:contain}}</style></head><body><header><div class="logo">G<b>O</b>C</div><div class="meta">GENESIS OWNERS CLUB</div></header><div class="hero"><small>THE ART OF DRIVE</small><h1>DRIVE GALLERY</h1><p>길 위의 순간을 작품으로, GOC 드라이브 컬렉션.</p></div><main class="wrap"><div class="count">COLLECTION / 05</div><div id="grid" class="grid"></div></main><footer>GOC · 함께 잇는 가치</footer><div class="viewer" id="viewer"><button onclick="closePhoto()">×</button><img id="big" alt="확대 이미지"></div><script>const data=[['grok_1794910995773.jpg','SUNSET COAST','노을이 머무는 해안도로'],['1794898072974.png','AURORA NIGHT','오로라 아래의 밤'],['file_0000000052d082118f5c13c40632d172.png','SWEET SUNSET','설렘을 싣고 달리는 순간'],['file_00000000bf2c81fa9237003f6451c07e.png','FIRE DRIVE','불꽃처럼 선명한 순간'],['file_00000000c6dc81f890557bc3d8b8b803.png','NEON CITY','도심을 가르는 빛']];data.forEach((p,i)=>{let card=document.createElement('div');card.className='tile';card.innerHTML='<img src="'+p[0]+'" alt="'+p[1]+'" loading="lazy"><div class="label"><small>FRAME 0'+(i+1)+'</small><h2>'+p[1]+'</h2><p>'+p[2]+'</p></div>';card.onclick=()=>{document.getElementById('big').src=p[0];document.getElementById('viewer').classList.add('on')};document.getElementById('grid').append(card)});function closePhoto(){document.getElementById('viewer').classList.remove('on')}document.getElementById('viewer').addEventListener('click',e=>{if(e.target.id!=='big')closePhoto()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhoto()})</script></body></html>
